<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yembulluri Sudhendra Siva Nadh — Full Stack Developer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme:light;
  --ink:#0F172A; --body:#4B5563; --muted:#6B7280; --line:#E5E7EB; --soft:#F5F7FA;
  --accent:#2556FF; --live:#16A34A; --r:12px;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px;-webkit-text-size-adjust:100%}
body{font:400 15px/1.65 var(--font);color:var(--body);background:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"cv11","ss03";overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent);color:#fff}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;transition:transform .2s var(--ease)}
:is(.btn,.platform,.repo,.p-link):hover .ic-arrow{transform:translateX(2px)}
:is(.repo,.platform,.icon-btn):hover .ic-external{transform:translate(2px,-2px)}

/* progress + nav */
.progress{position:fixed;top:0;left:0;height:2px;width:0;z-index:100;background:var(--accent)}
.nav-wrap{position:fixed;top:10px;left:0;right:0;z-index:60;display:flex;justify-content:center;padding:0 10px;pointer-events:none}
.nav{pointer-events:auto;position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;max-width:100%;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 1px 3px rgba(16,24,40,.06);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--ink);transition:transform .35s var(--ease), width .35s var(--ease)}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:color .2s}
.nav a:hover{color:var(--ink)}
.nav a.active,.nav a.active:hover{color:#fff}
.nav a .ic{font-size:15px}

/* layout */
main{max-width:936px;margin:0 auto;padding:0 20px}
section{position:relative;padding-top:64px}
h2{display:flex;align-items:center;gap:8px;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;color:var(--ink);margin-bottom:14px}
h2 .dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--live)}
.sub{color:var(--muted);font-size:.9rem;margin:-6px 0 16px}

/* hero */
.hero{padding:92px 0 0;display:flex;justify-content:space-between;align-items:center;gap:24px}
h1{font-size:clamp(1.7rem,4.4vw,2.25rem);font-weight:800;letter-spacing:-.03em;line-height:1.12;color:var(--ink)}
.socials{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;font-size:17px;background:#fff;border:1px solid var(--line);color:var(--ink);transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease)}
.icon-btn:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.icon-btn:active,.btn:active,.pill:active,.filter:active,.p-link:active{transform:scale(.97)}
.avatar{position:relative;width:112px;height:112px;flex:none;border-radius:50%;box-shadow:0 6px 18px -8px rgba(15,23,42,.35)}
.avatar .pic{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#5B8CFF,#1B2A6B 70%);border:3px solid #fff;font-size:3.1rem;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.avatar .pbadge{position:absolute;right:-2px;bottom:2px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:15px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* cards */
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);transition:border-color .2s, background .2s, box-shadow .2s}
.card.lift:hover{border-color:#D1D5DB;background:linear-gradient(180deg,#fff,#F8FAFC);box-shadow:0 4px 14px -8px rgba(15,23,42,.18)}
.pad{padding:20px 22px}
.about p{font-size:.95rem;line-height:1.75}
.about strong{color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* logos */
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:#F1F5F9;border:1px solid #E7ECF3;overflow:hidden}
.logo b{font-weight:800;font-size:12px;letter-spacing:-.02em}
.logo svg{width:20px;height:20px}

/* projects */
.projects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.project{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.project .head{display:flex;align-items:flex-start;gap:12px}
.project .grow{flex:1;min-width:0}
.p-tile{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--tc);background:var(--tb);border:1px solid var(--line)}
.project h3{font-size:.95rem;font-weight:600;letter-spacing:-.01em;color:var(--ink);line-height:1.3}
.kind{font:400 11.5px var(--mono);color:var(--muted);margin-top:2px}
.project p{flex:1;font-size:.85rem;line-height:1.6;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font:500 11px var(--mono);color:var(--body)}
.p-link{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-size:15px;color:var(--muted);border:1px solid var(--line);background:#fff;transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease)}
.p-link:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* certs */
.cert{display:flex;align-items:center;gap:14px;padding:16px 20px}
.cert h3{font-size:.95rem;font-weight:600;color:var(--ink);line-height:1.35}
.cert p{font-size:.85rem;color:var(--muted)}
.cert .grow{flex:1;min-width:0}
.cert .go{color:var(--muted);transition:color .2s}
.cert:hover .go{color:var(--accent)}

/* open source */
.deco{position:absolute;top:48px;right:0;width:96px;height:72px;pointer-events:none;opacity:.7;background-image:radial-gradient(#C7D2F0 1.3px,transparent 1.3px);background-size:14px 14px;-webkit-mask-image:linear-gradient(135deg,transparent 5%,#000 70%);mask-image:linear-gradient(135deg,transparent 5%,#000 70%)}
.repo{display:flex;flex-direction:column;gap:6px;padding:16px 18px;min-height:110px}
.repo .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.repo h3{display:flex;align-items:center;gap:9px;font-size:.98rem;font-weight:600;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.repo h3 .ic{font-size:1.15rem}
.repo .go{color:var(--muted);font-size:.95rem;transition:color .2s}
.repo:hover .go{color:var(--accent)}
.repo p{flex:1;font-size:.875rem;color:var(--muted)}
.meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.lang-dot{width:9px;height:9px;border-radius:50%}
.skeleton{min-height:110px;background:linear-gradient(100deg,#F3F5FA 30%,#fff 50%,#F3F5FA 70%);background-size:300% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{to{background-position:-100% 0}}
.handles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.9rem;font-weight:500;color:var(--ink);transition:border-color .2s,background .2s,transform .2s var(--ease)}
.pill:hover{border-color:#B9C0CC;background:var(--soft)}
.contrib-wrap{display:flex;justify-content:flex-end;margin-top:18px}
.contrib{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-weight:600;font-size:.82rem;color:var(--ink)}
.contrib[hidden]{display:none}
.contrib .dot{width:8px;height:8px;border-radius:50%;background:var(--live)}

/* skills */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filter{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:#334155;color:#fff;font-size:13px;font-weight:600;transition:background .2s,transform .2s var(--ease)}
.filter .ic{font-size:14px}
.filter .count{min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center;border-radius:99px;font-size:11px;background:rgba(255,255,255,.18)}
.filter:hover{background:#1E293B}
.filter[aria-pressed="true"]{background:#0B0F19}
.filter[aria-pressed="true"] .count{background:#fff;color:#0B0F19}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 11px 6px 9px;border-radius:8px;background:#F1F5F9;font:500 12.5px var(--mono);color:var(--ink);transition:background .2s}
.chip:hover{background:#E8EDF5}
.chip img{width:16px;height:16px;flex:none}
.chip .mi{display:inline-grid;place-items:center;font-size:15px;width:16px;height:16px}
.chip .fb{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;font:700 10px var(--font);font-style:normal;color:#fff}

/* coding profiles */
.platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.platform{display:block;padding:16px 18px}
.platform .head{display:flex;align-items:center;gap:12px}
.platform .grow{flex:1;min-width:0}
.platform h3{font-size:.95rem;font-weight:600;color:var(--ink);line-height:1.3}
.platform .handle{font:400 11.5px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.platform .go{color:var(--muted);transition:color .2s}
.platform:hover .go{color:var(--accent)}

/* education */
.row{display:flex;align-items:center;gap:14px;padding:16px 20px}
.row .grow{flex:1;min-width:0}
.row h3{font-size:1.05rem;font-weight:500;color:var(--ink);line-height:1.3}
.row .line{font:400 12.5px var(--mono);color:var(--muted);margin-top:3px}
.row .when{color:var(--muted);font-size:.875rem;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:2px 10px;border-radius:999px;background:#EDF1FF;color:var(--accent);font-weight:600;font-size:.78rem}

/* contact */
.contact{padding:30px 24px;text-align:center;background:linear-gradient(180deg,#fff,var(--soft))}
.contact h2{justify-content:center;margin-bottom:6px}
.contact p{color:var(--muted);font-size:.9rem;max-width:44ch;margin:0 auto 16px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.contact .socials{justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:9px;font-weight:600;font-size:13.5px;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s var(--ease)}
.btn .ic{font-size:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#1B44D6;box-shadow:0 4px 12px -4px rgba(37,86,255,.5)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#B9C0CC;background:var(--soft)}

footer{margin-top:64px;border-top:1px solid var(--line);padding:20px;text-align:center;color:var(--muted);font-size:12.5px}

/* toast + back to top */
.toast{position:fixed;left:50%;bottom:22px;z-index:90;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:500;font-size:13px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:transform .3s var(--ease),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .ic{color:#4ADE80}
.to-top{position:fixed;right:18px;bottom:18px;z-index:70;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(16,24,40,.08);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .25s,transform .25s var(--ease),background .2s,color .2s}
.to-top.show{opacity:1;transform:none;pointer-events:auto}
.to-top:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* motion */
.reveal{opacity:0;transform:translateY(10px);transition:opacity .45s ease, transform .45s var(--ease)}
.reveal.in{opacity:1;transform:none}
.hero-in{animation:fadeIn .5s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:720px){
  section{padding-top:52px}
  .hero{flex-direction:column-reverse;align-items:flex-start;padding-top:84px;gap:18px}
  .avatar{width:88px;height:88px}
  .avatar .pic{font-size:2.4rem}
  .grid2,.platforms,.projects{grid-template-columns:1fr}
  .nav a span{display:none}.nav a{padding:8px 11px}
  .row{flex-wrap:wrap}.row .when{width:100%;padding-left:54px;margin-top:-4px}
  .contrib-wrap{justify-content:center}
  .deco{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>

const CONFIG = {

const NAV = [["home","Home"],["about","About"],["projects","Projects"],["certs","Certs"],["oss","Open Source"],["skills","Skills"],["coding","Coding"],["education","Education"],["contact","Contact"]];
const nav = $("#nav"), ind = $("#navInd");
nav.insertAdjacentHTML("beforeend", NAV.map(([id,l]) => `<a href="#${id}" data-id="${id}">${ic(id)}<span>${l}</span></a>`).join(""));
const links = [...nav.querySelectorAll("a")];
function moveInd(a){
  ind.style.width = a.offsetWidth + "px";
  ind.style.transform = `translateX(${a.offsetLeft}px)`;
  a.scrollIntoView({ inline:"center", block:"nearest" });
}
function setActive(id){
  links.forEach(a => a.classList.toggle("active", a.dataset.id === id));
  const a = links.find(x => x.dataset.id === id); if(a) moveInd(a);
}
setActive("home");
addEventListener("resize", () => setActive((links.find(a => a.classList.contains("active")) || links[0]).dataset.id));
document.fonts && document.fonts.ready.then(() => setActive("home"));
const spy = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) setActive(e.target.id); }), { rootMargin:"-40% 0px -55% 0px" });
NAV.forEach(([id]) => spy.observe(document.getElementById(id)));

(function(){
  const CAT_ICON = { "All Skills":"skills", Languages:"projects", Frontend:"layout", Backend:"server", Databases:"database", Cloud:"cloud", Security:"shield", "Core CS":"cpu", Tools:"wrench" };
  const DEV = {
    "Java":"java/java-original","C":"c/c-original","HTML":"html5/html5-original","CSS":"css3/css3-original",
    "JavaScript":"javascript/javascript-original","React.js":"react/react-original","Spring Boot":"spring/spring-original",

    "MongoDB":"mongodb/mongodb-original","Git":"git/git-original","GitHub":"github/github-original"
  };
  const cats = ["All Skills", ...new Set(CONFIG.skills.map(k => k.cat))];
  let cur = "All Skills";
  const count = c => c === "All Skills" ? CONFIG.skills.length : CONFIG.skills.filter(k => k.cat === c).length;
  const mark = k => DEV[k.name]
    ? `<img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/${DEV[k.name]}.svg" width="20" height="20" alt="" loading="lazy" decoding="async" onerror="this.outerHTML='<i class=&quot;fb&quot; style=&quot;background:${k.color}&quot;>${k.ab[0]}</i>'">`
    : `<span class="mi" style="color:${k.color}">${ic(CAT_ICON[k.cat] || "skills")}</span>`;
  const draw = () => {
    $("#filters").innerHTML = cats.map(c => `<button class="filter" aria-pressed="${c === cur}" data-cat="${c}">${ic(CAT_ICON[c] || "skills")}${c}<span class="count">${count(c)}</span></button>`).join("");
    $("#chips").innerHTML = CONFIG.skills.filter(k => cur === "All Skills" || k.cat === cur)
      .map(k => `<span class="chip">${mark(k)}${k.name}</span>`).join("");
  };
  $("#filters").addEventListener("click", e => {
    const b = e.target.closest("[data-cat]"); if(!b) return;
    cur = b.dataset.cat; draw(); $(`.filter[data-cat="${cur}"]`).focus({ preventScroll:true });
  });
  draw();
})();

document.querySelectorAll("a[data-pdf]").forEach(a => a.addEventListener("click", e => {
  e.preventDefault();
  try{
    const bin = atob(LINGUA_PDF), arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: "application/pdf" }));
    window.open(url, "_blank") || (location.href = url);
  }catch(err){ toast("Couldn't open the certificate"); }
}));
$("#platformList").innerHTML = CONFIG.platforms.map(p => `
  <a class="card platform lift" href="${p.href}" target="_blank" rel="noopener">
    <div class="head"><div class="logo soft"><b style="color:${p.color}">${p.mark}</b></div><div class="grow"><h3>${p.name}</h3><div class="handle">@${p.handle}</div></div><span class="go">${ic("external")}</span></div>
  </a>`).join("");
$("#eduList").innerHTML = CONFIG.education.map(e => `
  <div class="card row lift"><div class="logo soft"><b style="color:${e.color}">${e.mark}</b></div>
    <div class="grow"><h3>${e.school}</h3><div class="line">${e.degree}</div>${e.cgpa ? `<span class="badge">${ic("star")}CGPA ${e.cgpa}</span>` : ""}</div>
    <div class="when">${e.from} — ${e.to}</div></div>`).join("");

/* ---- copy email + toast ---- */
let toastTimer;
function toast(msg){
  $("#toastText").textContent = msg; const t = $("#toast"); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
async function copyEmail(){
  try{ await navigator.clipboard.writeText(CONFIG.email); toast("Email copied to clipboard"); }
  catch(e){ toast(CONFIG.email); }
}
$("#copyContact").addEventListener("click", copyEmail);

/* ---- scroll progress, back to top, reveal ---- */
const prog = $("#progress"), toTopBtn = $("#toTop");
addEventListener("scroll", () => {
  const h = document.documentElement;
  prog.style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%";
  toTopBtn.classList.toggle("show", h.scrollTop > 600);
}, { passive:true });
toTopBtn.addEventListener("click", () => scrollTo({ top:0, behavior:"smooth" }));

const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold:.06 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
